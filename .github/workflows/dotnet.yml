# Build, test and package-check on every supported OS.
# The `dotnet test` shapes used here are documented in AGENTS.md ("Test load is capped on purpose").

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # Git-Bash on a Windows checkout can end up with CRLF line endings, which breaks the
    # POSIX helpers (set -e, sed -i, ...). Normalize before anything runs.
    - name: Normalize line endings (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: sed -i 's/\r$//' build-sh/*.sh src/Sa.Media.FFmpeg/build/*.sh

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      shell: bash
      run: ./build-sh/do-build.sh

    # Full suite — Docker is available on ubuntu-latest for the Testcontainers fixtures.
    # Exit code 8 means "a module discovered no tests": the three fixture projects under
    # src/Tests/Fixtures are part of the solution and run as empty modules (see AGENTS.md).
    # Ignore 8 — test failures (2) and infrastructure errors (10) stay fatal.
    - name: Test (full suite)
      if: runner.os == 'Linux'
      shell: bash
      env:
        TESTINGPLATFORM_EXITCODE_IGNORE: 8
      run: ./build-sh/do-test.sh

    # windows-latest has no Docker, so the Testcontainers suites cannot run there: this leg
    # covers Sa.Media.FFmpegTests only. The single-project shape keeps `dotnet test` on the
    # MTP driver, and -v n names every failing test with its exception and stack, so a
    # failure on an opaque runner is attributable (see AGENTS.md: Verbosity).
    - name: Test (Sa.Media.FFmpegTests)
      if: runner.os == 'Windows'
      working-directory: ./src
      run: dotnet test --project Tests/Sa.Media.FFmpegTests -c Release --no-build --no-restore -v n

    # Packs Sa.Media.FFmpeg into a throwaway feed and builds/runs a consumer against the
    # nupkg, asserting the bundled payload really landed in the consumer's output.
    - name: Package check (consumer from nupkg)
      shell: bash
      run: ./build-sh/do-package-check.sh

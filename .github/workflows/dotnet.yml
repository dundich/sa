# Build, test and package-check on every supported OS.
# The `dotnet test` shapes used here are documented in AGENTS.md ("Test load is capped on purpose").

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # Git-Bash on a Windows checkout can end up with CRLF line endings, which breaks the
    # POSIX helpers (set -e, sed -i, ...). Normalize before anything runs.
    - name: Normalize line endings (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: sed -i 's/\r$//' build-sh/*.sh src/Libraries/Media/Sa.Media.FFmpeg/build/*.sh

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      shell: bash
      run: ./build-sh/do-build.sh

    # Full suite — Docker is available on ubuntu-latest for the Testcontainers fixtures.
    # The exit code is the run's verdict: fixture projects under src/Tests/Fixtures are
    # excluded from test-module discovery (IsTestingPlatformApplication=false in
    # src/Tests/Fixtures/Directory.Build.props), so no empty module can end the run with
    # MTP exit code 8 (see AGENTS.md).
    - name: Test (full suite)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -o pipefail
        # Keep the runner's output for the failure report below. `pipefail` preserves the
        # step's verdict: without it the exit code would be `tee`'s, always 0.
        ./build-sh/do-test.sh 2>&1 | tee "$RUNNER_TEMP/test-full.log"

    # A failing `dotnet test` on the MTP driver only yields "Process completed with exit code 1"
    # in the run summary, and the full log is not reachable without repository admin access.
    # Re-emit the failing tests as workflow error annotations so the check-run API and the
    # GitHub UI both show which test failed and why.
    - name: Report failing tests
      if: failure() && runner.os == 'Linux'
      shell: bash
      run: |
        log="$RUNNER_TEMP/test-full.log"
        if [ ! -f "$log" ]; then
          echo "::error::Test log missing: $log"
          exit 0
        fi

        {
          # MTP prints `failed <Fully.Qualified.Name> [duration]` for every failing test
          # (optionally indented), while the summary line reads `failed: N` — the space after
          # the word plus the bracketed duration tells them apart.
          grep -E '(^|[[:space:]])failed .*\[[0-9]' "$log" | head -20
          echo
          # Details of the first failure: error message and stack trace.
          awk '/[[:space:]]failed .*\[[0-9]/{shown++} shown==1{print} shown==2{exit}' "$log" | head -40
        } > "$RUNNER_TEMP/failures.txt"

        if [ ! -s "$RUNNER_TEMP/failures.txt" ]; then
          # Not a test failure (exit code 8, a crashed module, ...): the tail says why.
          echo "no 'failed' lines found; tail of the test log" > "$RUNNER_TEMP/failures.txt"
          tail -60 "$log" >> "$RUNNER_TEMP/failures.txt"
        fi

        while IFS= read -r line; do
          line="${line//'%'/'%25'}"
          line="${line//$'\r'/}"
          echo "::error::$line"
        done < "$RUNNER_TEMP/failures.txt"

    - name: Upload test log
      if: always() && runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-test-log
        path: ${{ runner.temp }}/test-full.log
        if-no-files-found: ignore

    # windows-latest has no Docker, so the Testcontainers suites cannot run there: this leg
    # covers Sa.Media.FFmpegTests only. The single-project shape keeps `dotnet test` on the
    # MTP driver, and -v n names every failing test with its exception and stack, so a
    # failure on an opaque runner is attributable (see AGENTS.md: Verbosity).
    - name: Test (Sa.Media.FFmpegTests)
      if: runner.os == 'Windows'
      working-directory: ./src
      run: dotnet test --project Tests/Sa.Media.FFmpegTests -c Release --no-build --no-restore -v n

    # Packs Sa.Media.FFmpeg into a throwaway feed and builds/runs a consumer against the
    # nupkg, asserting the bundled payload really landed in the consumer's output.
    - name: Package check (consumer from nupkg)
      shell: bash
      run: ./build-sh/do-package-check.sh
